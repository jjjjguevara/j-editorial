name: Publish bounded Phase 3 research
on:
  push:
    branches: [research/bootstrap-phase-3-representation-evaluation]
    paths: ['research/phase-3/PUBLICATION-MANIFEST.json', '.github/workflows/bootstrap-research-publish.yml']
permissions:
  contents: read
jobs:
  publish-reviewed-research:
    if: github.repository == 'jjjjguevara/j-editorial' && github.ref == 'refs/heads/research/bootstrap-phase-3-representation-evaluation'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Verify exact scripts and current branch before generation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/research/bootstrap-phase-3-representation-evaluation | cut -f1)" = "$GITHUB_SHA"
          test "$(git hash-object research/phase-3/tools/run_experiments.py)" = '4ee5855c7b500c4941265cb007e59091e86998e4'
          test "$(git hash-object research/phase-3/tools/align_contracts.py)" = '2fb49a1942ed3644c9570fb8c712298dd37f2da6'
          test ! -e research/phase-3/results/behavioral-probes.json
      - name: Execute and verify allowlisted generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/phase-3/results
          python3 research/phase-3/tools/run_experiments.py --output research/phase-3/results/behavioral-probes.json
          python3 -c "import json; d=json.load(open('research/phase-3/results/behavioral-probes.json')); assert d['checks_passed']==d['checks_total']==67; assert d['experiment_sha256']=='323ad6f84a3fde8175e2ed99d8754cd45357d3c7841d4f4c67af210e2c8c05aa'"
          python3 research/phase-3/tools/align_contracts.py --apply > research/phase-3/results/contract-alignment.json
          git add -- BOOTSTRAP.md ROADMAP.md RESEARCH.md research/model-training-data/CHARTER.md research/phase-3/results/contract-alignment.json research/phase-3/results/behavioral-probes.json
          python3 -c "import json,subprocess; m=json.load(open('research/phase-3/PUBLICATION-MANIFEST.json')); p=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()); assert p==set(m['allowed_generated_paths'])"
          git -c core.whitespace=-blank-at-eol diff --cached --check
      - name: Commit only to the authorized research branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/research/bootstrap-phase-3-representation-evaluation | cut -f1)" = "$GITHUB_SHA"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'research: align accepted contracts and record Phase 3 execution'
          git push origin HEAD:refs/heads/research/bootstrap-phase-3-representation-evaluation
          test "$(git ls-remote origin refs/heads/research/bootstrap-phase-3-representation-evaluation | cut -f1)" = "$(git rev-parse HEAD)"
          mkdir -p "$RUNNER_TEMP/published-research"
          git rev-parse HEAD > "$RUNNER_TEMP/published-research/commit.txt"
          git archive HEAD -- BOOTSTRAP.md ROADMAP.md RESEARCH.md research/phase-3 research/model-training-data/CHARTER.md > "$RUNNER_TEMP/published-research/research.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: published-phase3-${{ github.sha }}
          path: ${{ runner.temp }}/published-research/
          retention-days: 3
          if-no-files-found: warn
